name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # macOS ships bash 3.2 as /bin/bash and that is what users run: keep a newer Homebrew bash off the front of PATH.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >>"$GITHUB_PATH"

      - name: Install the tools the suites need (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=""
          for t in jq lsof; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi

      - name: Show the tools
        run: |
          bash --version | head -1
          for t in git jq python3 gh lsof; do
            command -v "$t" || { echo "missing: $t"; exit 1; }
          done

      - name: DEBUG lsof (temporary)
        if: runner.os == 'macOS'
        run: |
          set +e
          sw_vers; which -a lsof python3; python3 --version; lsof -v 2>&1 | head -4
          python3 -m http.server 49555 --bind 127.0.0.1 >/dev/null 2>&1 &
          pid=$!; sleep 3; echo "pid=$pid"
          echo "--- t -i"; lsof -nP -tiTCP:49555 -sTCP:LISTEN; echo "rc=$?"
          echo "--- -i"; lsof -nP -iTCP:49555 -sTCP:LISTEN; echo "rc=$?"
          echo "--- -i no state"; lsof -nP -iTCP:49555; echo "rc=$?"
          echo "--- -i :port"; lsof -nP -i :49555; echo "rc=$?"
          echo "--- all listen"; lsof -nP -iTCP -sTCP:LISTEN | head -20; echo "rc=$?"
          echo "--- -a -p -i"; lsof -nP -a -p "$pid" -i; echo "rc=$?"
          echo "--- -p cwd"; lsof -a -p "$pid" -d cwd -Fn; echo "rc=$?"
          echo "--- -p all fds"; lsof -nP -p "$pid" | head -30; echo "rc=$?"
          echo "--- sudo"; sudo lsof -nP -tiTCP:49555 -sTCP:LISTEN; echo "rc=$?"
          echo "--- netstat"; netstat -anv -p tcp | grep 49555
          echo "--- nc"; nc -z 127.0.0.1 49555; echo "rc=$?"
          kill "$pid"
          exit 1

      - name: Run every suite
        run: bash test.sh
        env:
          TEST_TAIL: 200
