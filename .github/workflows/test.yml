name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # macOS ships bash 3.2 as /bin/bash and that is what users run: keep a newer Homebrew bash off the front of PATH.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >>"$GITHUB_PATH"

      - name: Install the tools the suites need (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=""
          for t in jq lsof; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi

      - name: Show the tools
        run: |
          bash --version | head -1
          for t in git jq python3 gh lsof; do
            command -v "$t" || { echo "missing: $t"; exit 1; }
          done

      - name: DEBUG lsof (temporary)
        if: runner.os == 'macOS'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/wt"; cd "$RUNNER_TEMP"
          export WF_GLOBAL_SETTINGS="$RUNNER_TEMP/none.sh" WF_PROTO_DIR="$RUNNER_TEMP/state" WF_PROTO_WAIT=4
          export WF_PROTO_CMD='python3 -m http.server "$PORT" --bind 127.0.0.1'
          fp=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          i=100
          for port in 49557 "$fp"; do
            i=$((i + 1)); echo "===== port $port issue $i"
            bash -x "$GITHUB_WORKSPACE/skills/orchestrate-gh-issues/proto-serve.sh" start "$i" "$RUNNER_TEMP/wt" "$port" 2>&1 | grep -v 'sleep 0.2\|i=\|alive\|kill -0\|-lt 20' | tail -45 | cut -c1-250
            echo "--- registry"; cat "$WF_PROTO_DIR/servers.tsv"
            pid=$(awk -F'\t' -v p="$port" '$3 == p {print $5}' "$WF_PROTO_DIR/servers.tsv")
            echo "--- ps $pid"; ps -o pid,ppid,pgid,stat,etime,command -p "$pid"
            echo "--- log"; cat "$WF_PROTO_DIR/$i.log"
            echo "--- netstat"; netstat -anv -p tcp | grep "$port"
            echo "--- lsof -p"; lsof -nP -p "$pid" | grep -v ' txt ' | cut -c1-200
            echo "--- lsof port"; lsof -nP -iTCP:"$port"; echo "rc=$?"
            echo "--- all python"; ps -axo pid,ppid,pgid,stat,command | grep -i '[p]ython' | cut -c1-220
          done
          exit 1

      - name: Run every suite
        run: bash test.sh
        env:
          TEST_TAIL: 200
