name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # macOS ships bash 3.2 as /bin/bash and that is what users run: keep a newer Homebrew bash off the front of PATH.
      - name: Use the system bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >>"$GITHUB_PATH"

      - name: Install the tools the suites need (Linux)
        if: runner.os == 'Linux'
        run: |
          missing=""
          for t in jq lsof; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ]; then sudo apt-get update -q && sudo apt-get install -y -q $missing; fi

      - name: Show the tools
        run: |
          bash --version | head -1
          for t in git jq python3 gh lsof; do
            command -v "$t" || { echo "missing: $t"; exit 1; }
          done

      - name: DEBUG lsof (temporary)
        if: runner.os == 'macOS'
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/wt"; log="$RUNNER_TEMP/srv.log"
          pid=$(python3 -I -c '
          import os, subprocess, sys
          wt, port, log, cmd = sys.argv[1:5]
          with open(log, "ab") as out:
              p = subprocess.Popen(["sh", "-c", "exec " + cmd], cwd=wt, env=dict(os.environ, PORT=port),
                                   stdin=subprocess.DEVNULL, stdout=out, stderr=out, start_new_session=True)
          print(p.pid)' "$RUNNER_TEMP/wt" 49556 "$log" 'python3 -m http.server "$PORT" --bind 127.0.0.1')
          sleep 3; echo "pid=$pid"; ps -o pid,pgid,stat,command -p "$pid"
          echo "--- log"; cat "$log"
          echo "--- lsof"; lsof -nP -tiTCP:49556 -sTCP:LISTEN; echo "rc=$?"
          echo "--- lsof verbose"; lsof -nP -iTCP:49556 -sTCP:LISTEN; echo "rc=$?"
          echo "--- lsof -p"; lsof -nP -a -p "$pid" -i; echo "rc=$?"
          echo "--- netstat"; netstat -anv -p tcp | grep 49556
          echo "--- nc"; nc -z 127.0.0.1 49556; echo "rc=$?"
          kill "$pid"
          echo "--- test -x"; bash -x skills/orchestrate-gh-issues/test-proto-serve.sh 2>&1 | head -120 | cut -c1-300
          exit 1

      - name: Run every suite
        run: bash test.sh
        env:
          TEST_TAIL: 200
